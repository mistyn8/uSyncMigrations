<div class="umb-property-editor umb-multiple-textbox" ng-controller="Tsd.PropertyEditors.MultipleTextBoxController">
  <ng-form name="multipleTextboxForm">      
    <div ui-sortable="sortableOptions" ng-model="model.value">
      <div class="flex flex-wrap textbox-wrapper" ng-repeat="item in model.value track by $index">
         
           
          <input type="text" name="item_{{$index}}" ng-model="item.value"
                 class="umb-property-editor umb-textstring textstring flx-i"
                 ng-trim="false"                
                 ng-keyup="addRemoveOnKeyDown($event, $index)"
                 ng-paste="paste($event, $index)"
                 focus-when="{{item.hasFocus}}" />
         

          <div class="icon-wrapper">
              <umb-icon icon="icon-navigation" class="icon handle" localize="title" title="@general_move"></umb-icon>
  
              <div class="umb-multiple-textbox__confirm" ng-show="model.value.length > model.config.min">
                  <button type="button" class="umb-multiple-textbox__confirm-action" ng-click="showPrompt($index, item)" localize="title" title="@content_removeTextBox">
                      <umb-icon icon="icon-trash"></umb-icon>
                  </button>
  
                  <umb-confirm-action
                      ng-if="promptIsVisible === $index"
                      direction="left"
                      on-confirm="remove($index)"
                      on-cancel="hidePrompt()">
                  </umb-confirm-action>
              </div>
          </div>
          <div style="flex-basis: 100%; height: 0;"></div>
          <span ng-messages="multipleTextboxForm['item_'+$index].$error" show-validation-on-submit>
             <span class="help-inline" ng-message="valRegex">The value entered is not a number</span>
              <span class="help-inline" ng-message="duplicate">Duplicate</span>
          </span>
      </div>

    </div>

    <button type="button" class="add-link" localize="title" title="@content_addTextBox"
       ng-show="model.config.max <= 0 || model.value.length < model.config.max"
       ng-click="add()">
        <localize key="general_add">Add</localize>
    </button>

    <input type="hidden" name="mandatory" ng-model="model.value" />
    <input type="hidden" name="duplicates" ng-model="model.value" />

    <div ng-messages="multipleTextboxForm.duplicates.$error" show-validation-on-submit>
        <div class="help text-error" ng-message="duplicates">Duplicates found {{model.displayDuplicates()}}</div>
        <span class="help-inline" ng-message="valServer" ng-bind-html="multipleTextboxForm.duplicates.errorMsg">></span>
    </div>  
      
  </ng-form>
</div>
